<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AR Test</title>

    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

<a-scene embedded arjs="debugUIEnabled:false;" renderer="gammaOutput: true;" vr-mode-ui="enabled: false">
            <a-assets>
                <a-asset-item id="sexmaster" src="./sexmaster.glb"></a-asset-item>
            </a-assets>
            <a-marker preset="custom" type='pattern' url="pattern-marker.patt">
              <a-entity gltf-model="#sexmaster" scale="1 1 1" rotation="-20 0 0" animation-mixer></a-entity>
            </a-marker>
            <a-entity camera></a-entity>
        </a-scene>

</body>
</html>
