<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, target-densityDpi=device-dpi" />

    <title>AR Test</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.7.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.3.2/html2canvas.min.js"></script>
    
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <!-- モデルの大きさを変更するUI -->
    <div id="ar-controls">
        <span id="scale-value">100%</span>
        <input type="range" id="scale-slider" min="0.1" max="5.0" step="0.1" value="1.0">
    </div>


    <!-- ARscene -->
    <a-scene embedded arjs="debugUIEnabled:false;" renderer="gammaOutput: true;" vr-mode-ui="enabled: false">
        <!-- assets -->
        <a-assets>
            <a-asset-item id="sexmaster" src="./models/sexmaster.glb"></a-asset-item>
        </a-assets>

        <!-- marker -->
        <a-marker id="ar-marker" preset="custom" type="pattern" url="./markers/pattern-marker.patt">
            <!-- ARmodel -->
            <a-entity id="ar-model" gltf-model="#sexmaster" scale="1 1 1" rotation="-20 0 0" animation-mixer> </a-entity>
        </a-marker>

        <!-- camera -->
        <a-entity camera></a-entity>
    </a-scene>
    <button id="screenshot-button">📷</button>
    <!-- JavaScript -->
    <script src="./js/ar-controller.js"></script>

</body>
</html>
